[[area]]
id = "input"
status = "planned"
components = ["PongPlatform24"]
paths = ["dts/liuqin.dts", "configs/liuqin-board.json"]
inputs = ["NT36532 on spi@990000 CS0, 9.6 MHz, IRQ gpio21, swrst 0x1fb43e, firmware novatek/liuqin/novatek_nt36532_m81_fw_csot.bin"]
configuration = ["pong_touch=3 (the liuqin driver reads it as a probe level: 0 disables it, 3 starts clocks, pins, SPI and the report thread), liuqintouchpace=8 for the bit-banged path; keys use pong-buttons unchanged"]
procedure = ["Port an NT36532 SPI driver onto pong's QUP0 SE4 transport, following UniXNU-sheng ShengNovatekTouch for the protocol."]
findings = ["Same SPI engine and IRQ line as pong; the TDDI die is reset by the panel and needs its firmware after every panel prepare.", "Device 2026-11-09: SpringBoard receives contacts and the desktop reacts; the earlier \"no touch\" boots simply carried pong_touch=0."]
completion = ["Touches reach SpringBoard; keys lock and change volume."]
limits = ["Touch requires pong_touch>=3 in the command line; the same argument name is a boolean enable on the pong Goodix driver."]
next_action = ["Write the NT36532 transport after the desktop is reached."]
evidence = [{kind = "source", reference = "dts/liuqin.dts", result = "liuqin-touch records the mainline node's wiring: touchscreen@0 on spi4 (0x990000), IRQ gpio21, no reset gpio, firmware novatek_nt36532_m81_fw_csot.bin (mainline sm8475-xiaomi-liuqin.dts:1376-1415, cited in the node comment)."}, {kind = "device", reference = "shim-boot-pong-perf2-poweroff.img sha256 dc3dfdd5", result = "Touch worked with pong_touch=3 and liuqintouchpace=8 on 2026-11-09; the halt-touch image controlled the same driver."}]

